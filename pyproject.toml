[project]
name = "long-term-memory-explorer"
version = "0.1.0"
description = "Interactive Streamlit app for learning how long-term memory lets an LLM remember users across conversations"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "streamlit>=1.50",
    "pandas>=2.2",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "openai>=1.93",
    "tiktoken>=0.7",
    "python-dotenv>=1.0",
    "mem0ai==0.1.113",
    "chromadb>=0.5",
    "ollama>=0.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
